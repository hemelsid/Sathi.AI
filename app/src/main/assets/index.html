<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>সাথী AI</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="ib" id="menuBtn" aria-label="মেনু"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h11M4 17h16"/></svg></button>
    <button class="title" id="modelBtn" aria-label="মডেল বদলান">
      <span class="t1" id="convTitle">সাথী AI</span>
      <span class="t2"><span id="modelName">সাথী অটো</span><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></span>
    </button>
    <button class="ib" id="talkBtn" aria-label="কথা বলুন"><svg viewBox="0 0 24 24"><path d="M3 12v-1a9 9 0 0118 0v1"/><rect x="2.5" y="12" width="4.5" height="7" rx="2"/><rect x="17" y="12" width="4.5" height="7" rx="2"/></svg></button>
    <button class="ib" id="newBtn" aria-label="নতুন চ্যাট"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
  </header>

  <main id="chat" class="chat"></main>

  <footer class="composer-wrap">
    <div class="composer" id="composer">
      <div id="pending" class="pending"></div>
      <textarea id="input" rows="1" placeholder="সাথীকে লিখুন…"></textarea>
      <div class="crow" id="crow">
        <button class="cb" id="attachBtn" aria-label="ফাইল যোগ"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="chip-btn" id="agentBtn" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg><span>এজেন্ট</span></button>
        <div class="sp"></div>
        <button class="cb" id="micBtn" aria-label="ভয়েসে বলুন"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
        <button class="cb send" id="sendBtn" aria-label="পাঠান"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
      <div class="recbar" id="recbar" hidden>
        <button class="cb" id="recCancel" aria-label="বাতিল"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <div class="rec-mid"><span class="dot"></span><span id="recTime">0:00</span><div class="bars" id="recBars"></div></div>
        <button class="cb send" id="recDone" aria-label="শেষ"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button>
      </div>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*,application/pdf,text/*,audio/*,.csv,.json,.md" hidden>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dr-head">
    <div class="brand"><img src="img/logo.svg" alt=""><b>সাথী AI</b></div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="searchInput" placeholder="চ্যাট খুঁজুন"></div>
  </div>
  <button class="dr-new" id="drNew"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>নতুন চ্যাট</button>
  <div class="dr-list" id="convList"></div>
  <nav class="dr-foot">
    <button data-go="studio">🎨 ছবি ও ভিডিও স্টুডিও</button>
    <button data-go="usage">📊 ব্যবহার ও লিমিট</button>
    <button data-go="custom">🧬 আমার মডেল</button>
    <button data-go="providers">🔑 AI প্রোভাইডার ও API</button>
    <button data-go="memory">🧠 স্মৃতি</button>
    <button data-go="settings">⚙️ সেটিংস</button>
  </nav>
</aside>

<div id="layers"></div>

<div class="talk" id="talk" hidden>
  <div class="talk-top"><span id="talkModel"></span><button class="ib" id="talkClose" aria-label="বন্ধ"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="orb-wrap"><button class="orb" id="orb" aria-label="কথা"><span class="ring"></span><span class="core"></span></button></div>
  <div class="talk-status" id="talkStatus">ট্যাপ করে কথা বলুন</div>
  <div class="talk-text" id="talkText"></div>
  <div class="talk-hint">কথা শেষ হলে নিজেই থামবে · উত্তরের মাঝে ট্যাপ করলে থেমে শুনবে</div>
</div>

<div class="toast" id="toast"></div>

<script src="js/core.js"></script>
<script src="js/providers.js"></script>
<script src="js/usage.js"></script>
<script src="js/tools.js"></script>
<script src="js/voice.js"></script>
<script src="js/media.js"></script>
<script src="js/app.js"></script>
</body>
</html>
