name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || echo "::error::Android SDK missing on runner"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK (unsigned)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! gradle --no-daemon :app:assembleRelease 2>&1 | tee build.log; then
            grep -E "error|What went wrong|FAILURE|Could not|>" build.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release-unsigned.apk ShathiAI-unsigned.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShathiAI-unsigned
          path: ShathiAI-unsigned.apk

      - name: Publish unsigned build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }} (unsigned)"
          body: "Unsigned build output. The installable, signed APK is published in the 'latest' release."
          files: ShathiAI-unsigned.apk
          prerelease: true
          make_latest: false
